<section class="sign-in-page">
  <div class="sign-in-container">
    <header class="sign-in-header">
      <h1 class="brand-title">Our Chat</h1>
      <p class="subtitle">Entrar na Conta</p>
      
      <div id="connection-status" class="connection-status offline">
        <span class="status-dot"></span>
        <span id="status-text" class="status-text">Desconectado</span>
      </div>
    </header>

    <form class="sign-in-form">
      <div class="form-group">
        <label for="email-input">E-mail:</label>
        <input
          type="email"
          id="email-input"
          class="console-input"
          name="email"
          placeholder="seu@email.com..."
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password-input">Senha:</label>
        <input
          type="password"
          id="password-input"
          class="console-input"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submit-btn" class="btn-submit" disabled>
        Entrar via WS
      </button>

      <p class="redirect-link">
        Não tem uma conta? <a href="/sign-up" id="to-signup">Cadastre-se</a>
      </p>
    </form>
  </div>
</section>
