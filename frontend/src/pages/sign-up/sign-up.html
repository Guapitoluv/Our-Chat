<section class="sign-up-page">
  <div class="sign-up-container">
    <header class="sign-up-header">
      <h1 class="brand-title">Our Chat</h1>
      <p class="subtitle">Criar Identidade E2EE</p>
      
      <!-- Indicador de Status da Conexão -->
      <div id="connection-status" class="connection-status offline">
        <span class="status-dot"></span>
        <span id="status-text" class="status-text">Desconectado</span>
      </div>
    </header>

    <form class="sign-up-form">
      <div class="form-group">
        <label for="name-input">Nome:</label>
        <input
          type="text"
          id="name-input"
          class="console-input"
          name="name"
          placeholder="Seu nome ou nick..."
          required
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="email-input">E-mail:</label>
        <input
          type="email"
          id="email-input"
          class="console-input"
          name="email"
          placeholder="seu@email.com..."
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password-input">Senha:</label>
        <input
          type="password"
          id="password-input"
          class="console-input"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="new-password"
        >
      </div>

      <button type="submit" id="submit-btn" class="btn-submit" disabled>
        Cadastrar via WS
      </button>
    </form>
  </div>
</section>
