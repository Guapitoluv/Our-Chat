<section class="conversation-page">

  <header class="conversation-header">

    <a
      id="back-button"
      class="button"
      aria-label="Voltar"
      href="/"
      data-route
    >&lt;</a>

    <h1>Conversation</h1>

  </header>


  <main id="messages">

    <div class="message message--received">
      <p>Hello</p>
    </div>

    <div class="message message--sent">
      <p>Hi!</p>
    </div>

  </main>


  <form id="message-form">

    <textarea
      id="message-input"
      placeholder="Digite uma mensagem..."
      rows="1"
    ></textarea>

    <button
      id="send-button"
      type="submit"
      aria-label="Enviar mensagem"
    >&gt;</button>

  </form>

</section>
