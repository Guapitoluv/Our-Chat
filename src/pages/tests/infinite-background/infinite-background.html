<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Infinite Video Background</title>

    <link
        rel="stylesheet"
        href="infinite-background.css"
    >
</head>

<body>

    <video
        id="background-video"
        src="video.mp4"
        autoplay
        muted
        loop
        playsinline
    ></video>

    <canvas id="background"></canvas>

    <script
        src="infinite-background.js"
    ></script>

</body>

</html>
