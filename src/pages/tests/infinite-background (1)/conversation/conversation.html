<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Conversation</title>

  <link
    rel="stylesheet"
    href="../../../../fonts/silkscreen.css"
  >

  <link
    rel="stylesheet"
    href="./conversation.css"
  >
</head>

<body data-theme="light">

  <header>
    <a
      id="back-button"
      class="button"
      aria-label="Voltar"
      href="../infinite-background.html"
    >&lt;</a>

    <h1>Conversation</h1>
  </header>

  <main id="messages">
    <div class="message message--received">
      <p>Hello</p>
    </div>

    <div class="message message--sent">
      <p>Hi!</p>
    </div>
  </main>

  <form id="message-form">
    <textarea
      id="message-input"
      placeholder="Digite uma mensagem..."
      rows="1"
    ></textarea>

    <button
      id="send-button"
      type="submit"
      aria-label="Enviar mensagem"
    >&gt;</button>
  </form>
  
  <script src="./conversation.js"></script>

</body>

</html>
